name: CI

# The proof is in CI: a green check means the ledger's correctness claims held.
# Steps are guarded by file existence so this runs cleanly now (planning phase)
# and becomes the real demo as the code in PLAN.md lands — no rewrite needed.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ledger correctness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start CockroachDB (single node)
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:v24.1.5 start-single-node --insecure
      - name: Wait for CockroachDB
        run: |
          for i in $(seq 1 30); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::CockroachDB did not become ready"; docker logs crdb; exit 1
      - name: Unit + integration tests
        # The invariant unit tests always run; the integration tests post
        # movements against the live cluster when this URL is set.
        env:
          LEDGER_TEST_DATABASE_URL: "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
        run: go test ./...

  failure-demo:
    name: Headline demo — kill a node, invariant holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose stack
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q && echo "docker-compose.yml is valid"
          else
            echo "::notice::docker-compose.yml not present yet (PLAN.md DoD). This job will boot the multi-node CockroachDB cluster, run a concurrent load test, kill a node mid-load, and assert ∑debits=∑credits still holds — no double-spend, no lost entries."
          fi
